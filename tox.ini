[tox]
envlist = cover, black, flake8, pylint, license
isolated_build = true
skipsdist = true

# NOTE: requirements.txt is deliberately NOT installed in the default test
# environment. The unit tests mock scancode's subprocess invocation and need
# only pathspec; the license environment below installs the real toolkit.
[testenv]
deps =
    pathspec==0.12.1
setenv =
    PYTHONPATH = {toxinidir}

[testenv:cover]
deps =
    {[testenv]deps}
    coverage
commands =
    coverage run -m unittest discover -s tests -t .
    coverage report -m
    coverage html

[testenv:black]
deps = black
skip_install = true
commands = black --check --diff main.py scanner tests

[testenv:flake8]
deps = flake8
skip_install = true
commands = flake8 main.py scanner tests

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint
commands = pylint main.py scanner tests

[testenv:license]
deps =
    -rrequirements.txt
skip_install = true
commands =
    git diff --binary --output={toxworkdir}/self.patch HEAD^ HEAD
    python main.py {toxworkdir}/self.patch qualcomm/copyright-license-checker-action

[testenv:autoformat]
deps = {[testenv:black]deps}
skip_install = true
commands = black main.py scanner tests
